name: 🔎 Code Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The full suite runs in the merge queue before anything reaches main.
  merge_group:

# A new commit on a PR makes the previous run worthless: cancel it.
# Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linter:
    name: 🧹 Linter
    if: github.event.pull_request.draft == false
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run oxlint
        run: .github/scripts/budget.sh 5 node_modules/.bin/oxlint --deny-warnings .

  typescriptChecker:
    name: 🟦 TypeScript Checker
    if: github.event.pull_request.draft == false
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      # Target is 5s. tsc takes 4.7s on GitHub's 4-vCPU runners, too close
      # to hold reliably: 8s until the job runs on 8 cores.
      - name: Run Typescript checker
        run: .github/scripts/budget.sh 8 node_modules/.bin/tsc --noEmit

  tests:
    name: 🔬 Tests
    if: github.event.pull_request.draft == false
    timeout-minutes: 2
    runs-on: ubuntu-latest
    # Chromium and its system dependencies come baked in the image: no
    # apt-get at run time (see e2e-tests.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_S3_BUCKET_PUBLIC_URL: 'http://localhost:9000/default'
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      - name: Check Playwright image version
        uses: ./.github/actions/check-playwright-image

      # On PRs, run only the tests the diff can reach through the module
      # graph. The merge queue and main always run the full suite.
      - name: Run tests
        env:
          SKIP_ENV_VALIDATION: true
          CHANGED: ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}
        run: .github/scripts/budget.sh 60 node_modules/.bin/vitest run $CHANGED
