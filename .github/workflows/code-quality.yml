name: 🔎 Code Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new commit on a PR makes the previous run worthless: cancel it.
# Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linter:
    name: 🧹 Linter
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run oxlint
        run: pnpm oxlint --deny-warnings .

  typescriptChecker:
    name: 🟦 TypeScript Checker
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      - name: Run Typescript checker
        run: pnpm run lint:ts

  tests:
    name: 🔬 Tests
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Chromium and its system dependencies come baked in the image: no
    # apt-get at run time (see e2e-tests.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_S3_BUCKET_PUBLIC_URL: 'http://localhost:9000/default'
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      - name: Check Playwright image version
        uses: ./.github/actions/check-playwright-image

      - name: Run tests
        run: SKIP_ENV_VALIDATION=true pnpm run test:ci
