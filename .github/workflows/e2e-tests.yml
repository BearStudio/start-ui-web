name: 🧪 E2E Tests
on:
  push:
    branches:
      - master
      - main
      - develop
      - staging
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new commit on a PR makes the previous run worthless: cancel it.
# Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  E2E:
    name: E2E (${{ matrix.browser }})
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://startui:startui@localhost:5432/startui
      VITE_IS_DEMO: false
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://username:password@localhost:1025
      EMAIL_FROM: Start UI <noreply@example.com>
      # No object storage runs in CI: the e2e suite never uploads files.
      # These values only satisfy env validation. If an upload e2e test is
      # added, start an S3-compatible service here (see docker-compose.yml).
      S3_HOST: localhost:7070
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: startui-access-key
      S3_SECRET_ACCESS_KEY: startui-secret-key
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      VITE_S3_BUCKET_PUBLIC_URL: http://localhost:7070/default
    steps:
      # Start services in the background so image pulls and boot overlap
      # with checkout and install. `services:` would block the job until
      # both are pulled and healthy.
      - name: Start services
        run: |
          # The step runs under `bash -e`, inherited by the subshell: a bare
          # failing `docker run` would exit before writing the status file and
          # leave "Wait for services" polling forever. An `if` is exempt.
          start() {
            name=$1; shift
            (
              if docker run -d --name "$name" "$@" > "/tmp/$name.log" 2>&1; then
                echo 0 > "/tmp/$name.status"
              else
                echo $? > "/tmp/$name.status"
              fi
            ) &
          }
          start postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=startui -e POSTGRES_USER=startui -e POSTGRES_DB=startui \
            --health-cmd pg_isready --health-interval 1s \
            postgres:16.1
          start maildev -p 1025:1025 -p 1080:1080 \
            --health-cmd "wget --spider --no-verbose --tries=1 -T 3 http://localhost:1080/healthz" \
            --health-interval 1s \
            maildev/maildev:2.2.1

      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: Wait for services
        run: |
          for c in postgres maildev; do
            until [ -f "/tmp/$c.status" ]; do sleep 0.2; done
            if [ "$(cat /tmp/$c.status)" != 0 ]; then cat "/tmp/$c.log"; exit 1; fi
            # Failed probes are retried until the deadline, then the job fails
            # instead of hanging until the job timeout.
            deadline=$((SECONDS + 60))
            until [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ]; do
              if [ "$(docker inspect -f '{{.State.Running}}' $c)" != true ] || [ "$SECONDS" -ge "$deadline" ]; then
                echo "$c did not become healthy"
                docker logs $c
                docker inspect -f '{{json .State.Health}}' $c
                exit 1
              fi
              sleep 0.2
            done
          done

      - name: Migrate database
        run: pnpm db:push

      - name: Add default data into database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
