name: 🧪 E2E Tests
on:
  push:
    branches:
      - master
      - main
      - develop
      - staging
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  E2E:
    name: E2E (${{ matrix.browser }})
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://startui:startui@localhost:5432/startui
      VITE_IS_DEMO: false
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://username:password@localhost:1025
      EMAIL_FROM: Start UI <noreply@example.com>
      # No object storage runs in CI: the e2e suite never uploads files.
      # These values only satisfy env validation. If an upload e2e test is
      # added, start an S3-compatible service here (see docker-compose.yml).
      S3_HOST: localhost:7070
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: startui-access-key
      S3_SECRET_ACCESS_KEY: startui-secret-key
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      VITE_S3_BUCKET_PUBLIC_URL: http://localhost:7070/default
    services:
      postgres:
        image: postgres:16.1

        env:
          POSTGRES_PASSWORD: startui
          POSTGRES_USER: startui
          POSTGRES_DB: startui

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      maildev:
        image: maildev/maildev:2.2.1
        options: >-
          --health-cmd "wget --spider --no-verbose --tries=1 -T 3 http://localhost:1080/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1025:1025
          - 1080:1080

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium ${{ matrix.browser }}

      - name: Migrate database
        run: pnpm db:push

      - name: Add default data into database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
