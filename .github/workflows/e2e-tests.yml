name: 🧪 E2E Tests
on:
  push:
    branches:
      - master
      - main
      - develop
      - staging
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The full suite runs in the merge queue before anything reaches main.
  merge_group:

# A new commit on a PR makes the previous run worthless: cancel it.
# Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  E2E:
    name: E2E (${{ matrix.browser }})
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Browsers and their system dependencies come baked in the image: no
    # apt-get at run time. Ubuntu mirrors made `playwright install-deps`
    # take from 13s to over 4 minutes. Keep the tag equal to the
    # `playwright` version in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:16.1
        env:
          POSTGRES_PASSWORD: startui
          POSTGRES_USER: startui
          POSTGRES_DB: startui
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
      maildev:
        image: maildev/maildev:2.2.1
        options: >-
          --health-cmd "wget --spider --no-verbose --tries=1 -T 3 http://localhost:1080/healthz"
          --health-interval 1s
    strategy:
      fail-fast: false
      matrix:
        # PRs get chromium feedback; the merge queue and main run every browser.
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://startui:startui@postgres:5432/startui
      VITE_IS_DEMO: false
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://username:password@maildev:1025
      EMAIL_FROM: Start UI <noreply@example.com>
      MAILDEV_API_URL: http://maildev:1080
      # No object storage runs in CI: the e2e suite never uploads files.
      # These values only satisfy env validation. If an upload e2e test is
      # added, start an S3-compatible service here (see docker-compose.yml).
      S3_HOST: localhost:7070
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: startui-access-key
      S3_SECRET_ACCESS_KEY: startui-secret-key
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      VITE_S3_BUCKET_PUBLIC_URL: http://localhost:7070/default
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless, not shallow: full history for merge-base, blobs on demand.
          filter: blob:none
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 26

      - name: Check Playwright image version
        uses: ./.github/actions/check-playwright-image
        with:
          # The setup project logs in with chromium.
          browsers: chromium ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm db:push

      - name: Add default data into database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
